<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>训练反馈实验</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:#f3f4f6;

    font-family:sans-serif;

    transition:0.2s;
}

h1{

    font-size:32px;
    margin-bottom:20px;

}

button{

    width:260px;

    padding:18px;

    margin:10px;

    border:none;
    border-radius:20px;

    background:#5b8def;

    color:white;

    font-size:20px;

    box-shadow:0 6px 18px rgba(0,0,0,0.15);

    transition:0.15s;
}

button:active{

    transform:scale(0.96);

}

#status{

    margin-top:25px;

    font-size:22px;

    color:#333;
}

#timer{

    margin-top:12px;

    font-size:28px;

    font-weight:bold;

    color:#5b8def;
}

.flash{

    background:#ffd966 !important;
}

</style>

</head>

<body>

<h1>训练反馈实验</h1>

<button onclick="startExperiment('none')">
基础训练模式
</button>

<button onclick="startExperiment('light')">
视觉提示模式
</button>

<button onclick="startExperiment('vibration')">
无屏触觉模式
</button>

<button onclick="startExperiment('emotion')">
情绪引导模式
</button>

<div id="status">
请选择实验模式
</div>

<div id="timer">
02:00
</div>

<script>

let feedbackInterval;
let countdownInterval;

function startExperiment(mode){

    clearInterval(feedbackInterval);
    clearInterval(countdownInterval);

    let totalTime = 120;

    updateTimer(totalTime);

    document.getElementById("status").innerText =
    "实验进行中...";

    // 安卓需要用户点击后先触发一次
    triggerFeedback(mode);

    // 每秒循环反馈
    feedbackInterval = setInterval(()=>{

        triggerFeedback(mode);

    },1000);

    // 倒计时
    countdownInterval = setInterval(()=>{

        totalTime--;

        updateTimer(totalTime);

        if(totalTime <= 0){

            clearInterval(feedbackInterval);
            clearInterval(countdownInterval);

            document.getElementById("status").innerText =
            "实验结束";

            if(navigator.vibrate){

                navigator.vibrate([200,100,200]);

            }

        }

    },1000);

}

function triggerFeedback(mode){

    // 基础模式
    if(mode === "none"){

        return;

    }

    // 灯光模式
    if(mode === "light"){

        flashScreen();

    }

    // 震动模式
    if(mode === "vibration"){

        if(navigator.vibrate){

            navigator.vibrate(120);

        }

    }

    // 情绪模式
    if(mode === "emotion"){

        flashScreen();

        if(navigator.vibrate){

            navigator.vibrate([80,50,120]);

        }

    }

}

function flashScreen(){

    document.body.classList.add("flash");

    setTimeout(()=>{

        document.body.classList.remove("flash");

    },200);

}

function updateTimer(seconds){

    let min = Math.floor(seconds / 60);
    let sec = seconds % 60;

    if(sec < 10){

        sec = "0" + sec;

    }

    document.getElementById("timer").innerText =
    min + ":" + sec;

}

</script>

</body>

</html>
