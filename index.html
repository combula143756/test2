<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>训练反馈实验</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:#f3f4f6;

    font-family:sans-serif;

    transition:0.2s;
}

h1{

    margin-bottom:30px;

    font-size:30px;
}

button{

    width:260px;

    padding:20px;

    margin:12px;

    border:none;
    border-radius:20px;

    background:#5b8def;

    color:white;

    font-size:20px;

    box-shadow:0 6px 18px rgba(0,0,0,0.15);

    transition:0.15s;
}

button:active{

    transform:scale(0.95);

}

.flash{

    background:#ffd966 !important;
}

#text{

    margin-top:30px;

    font-size:20px;

    color:#333;
}

</style>
</head>

<body>

<h1>训练反馈实验</h1>

<button onclick="noneMode()">
无反馈
</button>

<button onclick="lightMode()">
灯光反馈
</button>

<button onclick="vibrationMode()">
震动反馈
</button>

<button onclick="emotionMode()">
情绪反馈
</button>

<div id="text">
点击按钮体验不同反馈
</div>

<script>

function noneMode(){

    document.getElementById("text").innerText =
    "无反馈模式";

}

function lightMode(){

    document.body.classList.add("flash");

    setTimeout(()=>{

        document.body.classList.remove("flash");

    },200);

    document.getElementById("text").innerText =
    "灯光反馈已触发";

}

function vibrationMode(){

    if(navigator.vibrate){

        navigator.vibrate(120);

    }

    document.getElementById("text").innerText =
    "震动反馈已触发";

}

function emotionMode(){

    if(navigator.vibrate){

        navigator.vibrate([80,50,120]);

    }

    document.body.classList.add("flash");

    setTimeout(()=>{

        document.body.classList.remove("flash");

    },200);

    document.getElementById("text").innerText =
    "情绪反馈已触发";

}

</script>

</body>
</html>
